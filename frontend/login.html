<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay">
        <p class="overlay-text"></p>
        <button class="close-button">close</button>
    </div>
    <header>
        <h1 class="text">Login portal</h1>
    </header>
    <div class="buttons">
        <input type="text" class="username" placeholder="Enter your username"></input>
        <input type="email" class="email" placeholder="Enter your email"></input>
        <input type="password" class="password" placeholder="Enter your password"></input>
        <p class="error" class="error"></p>
        <button class="login">Login</button>
        <button class="switch-page">Sign up</button>
    </div>  
</body>
</html>
